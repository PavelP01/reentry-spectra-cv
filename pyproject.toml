[project]
name = "reentry-spectra-cv"
version = "0.1.0"
description = "Classical CV & Spectroscopy pipeline for distinguishing space debris reentry from natural meteors"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.9.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "astropy>=6.0.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
